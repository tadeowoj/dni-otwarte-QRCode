<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Administratora - QR Gra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <style>
    /* Nadpisujemy lekko style do tabel dla szerokiej wersji admina */
    #app-container { max-width: 1000px; }
    .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 2rem; }
    .stat-card { text-align: center; }
    .stat-card h3 { color: var(--clr-text-muted); font-size: 0.875rem; }
    .stat-card p { font-family: var(--font-heading); font-size: 2.5rem; color: var(--clr-text); line-height: 1; margin-top: 8px; }
    
    .table-container { overflow-x: auto; background: rgba(255,255,255,0.72); border: 1px solid var(--clr-glass-border); border-radius: 8px; }
    table { width: 100%; min-width: 600px; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 16px; border-bottom: 1px solid var(--clr-glass-border); font-size: 0.875rem; }
    th { color: var(--clr-text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; background: rgba(139, 92, 246, 0.08); }
    tr:last-child td { border-bottom: none; }
    .badge { padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
    .badge-success { background: rgba(22,163,74,0.14); color: var(--clr-neon-green); border: 1px solid rgba(22,163,74,0.35); }
    .badge-pending { background: rgba(245,158,11,0.2); color: var(--clr-warning); border: 1px solid rgba(245,158,11,0.5); }
    
    .btn-small { padding: 6px 12px; font-size: 0.75rem; background: rgba(139, 92, 246, 0.12); border: 1px solid rgba(139, 92, 246, 0.35); color: var(--clr-text); border-radius: 8px; cursor: pointer; }
    .btn-small:hover, .btn-small:focus-visible { background: rgba(139, 92, 246, 0.2); border-color: var(--clr-purple-dark); }
    .btn-small:disabled { background: rgba(148, 163, 184, 0.2); border-color: rgba(148, 163, 184, 0.35); color: var(--clr-text-muted); cursor: not-allowed; }
    .btn-logout { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.35); color: #dc2626; }
    .btn-logout:hover, .btn-logout:focus-visible { background: rgba(239, 68, 68, 0.22); border-color: #dc2626; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .draw-check-cell { width: 48px; text-align: center; }
    .draw-checkbox { width: 18px; height: 18px; accent-color: var(--clr-purple-dark); cursor: pointer; }
    .draw-list { display: grid; gap: 10px; }
    .draw-list-empty { color: var(--clr-text-muted); font-size: 0.9rem; }
    .draw-player-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 14px; background: rgba(255,255,255,0.72); border: 1px solid var(--clr-glass-border); border-radius: 8px; }
    .draw-player-main { min-width: 0; }
    .draw-player-main strong { display: block; }
    .draw-player-main small { display: block; color: var(--clr-text-muted); margin-top: 2px; }
    .draw-player-meta { color: var(--clr-text-muted); font-size: 0.78rem; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="bg-blob blob-purple"></div>
  <div class="bg-blob blob-neon-green"></div>

  <main id="app-container">
    <div id="toast" class="toast hidden"></div>

    <!-- WIDOK LOGOWANIA -->
    <section id="view-login" class="view active center-content">
      <div class="glass-card start-card">
        <h1 class="title">Panel Admina</h1>
        <p class="subtitle">Wymagany jest PIN uprawniający</p>
        <form id="admin-login-form" class="form-layout">
          <div class="input-group">
            <label for="admin-pin">Kod zaufania:</label>
            <input type="password" id="admin-pin" placeholder="****" required>
          </div>
          <button type="submit" id="btn-login" class="btn-primary">Dostęp</button>
        </form>
      </div>
    </section>

    <!-- WIDOK DASHBOARDU ADMINA -->
    <section id="view-admin" class="view hidden">
      <header class="glass-header" style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Nadzór - Dni Otwarte</h2>
        <div class="header-actions">
          <button id="btn-refresh" class="btn-small">Odśwież dane</button>
          <button id="btn-logout" class="btn-small btn-logout">Wyloguj</button>
        </div>
      </header>
      
      <div class="stat-cards">
        <div class="glass-card stat-card">
          <h3>Uczestnicy (Konta)</h3>
          <p id="stat-participants">0</p>
        </div>
        <div class="glass-card stat-card highlight-card">
          <h3 style="color:var(--clr-neon-green)">Mają Komplet</h3>
          <p id="stat-completed" class="clr-neon">0</p>
        </div>
        <div class="glass-card stat-card">
          <h3>Suma Skanów</h3>
          <p id="stat-scans">0</p>
        </div>
        <div class="glass-card stat-card">
          <h3>Aktywne Stacje</h3>
          <p id="stat-stations">0</p>
        </div>
      </div>

      <div class="glass-card" style="margin-bottom:20px;">
        <h3 class="section-title" style="margin-top:0;">Dziennik Graczy (Najwiecej kodow)</h3>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th class="draw-check-cell">Los</th>
                <th>Gracz</th>
                <th>Szkoła</th>
                <th>Kody</th>
                <th>Status</th>
                <th>Nagroda (Wydana)</th>
                <th>Akcja</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <!-- JS render -->
            </tbody>
          </table>
        </div>
      </div>

      <div class="glass-card" style="margin-bottom:20px;">
        <h3 class="section-title" style="margin-top:0;">Gracze biorący udział w losowaniu</h3>
        <div id="draw-list" class="draw-list">
          <p class="draw-list-empty">Brak graczy na liście losowania.</p>
        </div>
      </div>
    </section>
  </main>
  
  <script type="module" src="./admin.js"></script>
</body>
</html>

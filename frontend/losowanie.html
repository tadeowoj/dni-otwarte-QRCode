<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Losowanie - Wielki Finał</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <style>
    /* Custom styles for lottery view (will also be in style.css, but some layout fixes here) */
    .lottery-container {
      max-width: 1200px !important;
      width: 100%;
    }
    .lottery-header {
      text-align: center;
      margin-bottom: 3rem;
      animation: fadeInDown 0.8s ease-out;
    }
    .lottery-logo-wrapper {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--clr-purple-light), var(--clr-purple-dark));
      padding: 4px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(109, 40, 217, 0.3);
    }
    .lottery-logo-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
      background: #fff;
    }
    .lottery-main-title {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-family: var(--font-heading);
      font-weight: 800;
      background: linear-gradient(135deg, var(--clr-text), var(--clr-purple-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 10px;
    }
    .lottery-status-card {
      text-align: center;
      padding: 60px 40px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
      animation: pulseCard 3s infinite ease-in-out;
    }
    .glowing-text {
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      color: var(--clr-purple-dark);
      text-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
      margin: 20px 0;
    }
    .loader-spinner.large {
      width: 80px;
      height: 80px;
      border-width: 6px;
    }
    .finalists-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .finalist-card {
      background: rgba(255, 255, 255, 0.85);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid var(--clr-glass-border);
      box-shadow: 0 8px 16px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 5px;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }
    .finalist-nickname {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--clr-purple-dark);
    }
    .finalist-school {
      font-size: 0.9rem;
      color: var(--clr-text-muted);
    }
    
    @keyframes pulseCard {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="bg-blob blob-purple"></div>
  <div class="bg-blob blob-neon-green"></div>

  <main id="app-container" class="lottery-container">
    <div id="toast" class="toast"></div>

    <!-- WIDOK LOGOWANIA -->
    <section id="view-login" class="view active center-content">
      <div class="glass-card start-card" style="max-width: 450px;">
        <h1 class="title" style="text-align: center;">Finał - Logowanie</h1>
        <p class="subtitle" style="text-align: center;">Autoryzacja administracyjna</p>
        <form id="lottery-login-form" class="form-layout">
          <div class="input-group">
            <label for="admin-pin">PIN Administratora</label>
            <input type="password" id="admin-pin" placeholder="****" autocomplete="current-password" required>
          </div>
          <button type="submit" id="btn-login" class="btn-primary" style="width: 100%;">Otwórz Panel Finałowy</button>
        </form>
      </div>
    </section>

    <!-- WIDOK LOSOWANIA -->
    <section id="view-lottery" class="view hidden">
      <div class="lottery-header">
        <div class="lottery-logo-wrapper">
          <video class="lottery-logo-video" autoplay loop muted playsinline preload="auto">
            <source src="/img/logo.webm" type="video/webm">
          </video>
        </div>
        <h1 class="lottery-main-title">Wielki Finał</h1>
      </div>

      <div class="lottery-content">
        <div id="waiting-state" class="lottery-status-card">
          <div class="loader-spinner large"></div>
          <h2 class="glowing-text">Trwa ustalanie listy finalistów...</h2>
          <p class="lottery-sub-message">Przygotujcie się na emocje!</p>
        </div>

        <div id="finalists-state" class="finalists-area hidden">
          <div style="display:flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;">
             <h2 class="section-title" style="margin:0; font-size: 2rem;">Wybrani do losowania (<span id="finalist-count">0</span>)</h2>
             <button id="btn-lottery-logout" class="btn-ghost">Wyloguj</button>
          </div>
          <div id="finalists-grid" class="finalists-grid">
            <!-- JS dynamic render -->
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./losowanie.js"></script>
</body>
</html>
